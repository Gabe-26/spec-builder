<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FenceSpec Pro — Spec Sheet Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0f2640;--navy2:#1a3a5c;
  --gold:#c8943a;--gold2:#e0a84a;
  --cream:#f8f4ee;--cream2:#f0ebe0;
  --bg:#e2dfd8;--surface:#f5f3ef;
  --border:#ccc9c0;--border2:#b0aca4;
  --text:#1a1714;--text2:#4a4540;--text3:#7a7570;
  --danger:#b53528;--danger-bg:#fdf0ee;
  --rad:5px;--rad2:9px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── APP BAR ── */
.app-bar{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:3px solid var(--gold)}
.app-logo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;color:#fff;letter-spacing:.04em}
.app-logo em{color:var(--gold2);font-style:normal}
.app-div{width:1px;height:22px;background:rgba(255,255,255,.18)}
.app-sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.07em;text-transform:uppercase}
.spacer{flex:1}
.app-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:6px 14px;border-radius:var(--rad);font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.app-btn:hover{background:rgba(255,255,255,.2)}
.app-btn.gold{background:var(--gold);border-color:var(--gold2);font-weight:600}
.app-btn.gold:hover{background:var(--gold2)}
.app-body{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:252px;min-width:252px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:13px 13px 9px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.sb-search{position:relative}
.sb-search input{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--rad);padding:6px 10px 6px 28px;font-size:12px;font-family:'Barlow',sans-serif;color:var(--text)}
.sb-search input:focus{outline:none;border-color:var(--navy2)}
.sb-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.35;pointer-events:none}
.style-list{flex:1;overflow-y:auto;padding:5px}
.style-item{padding:8px 10px;border-radius:var(--rad);cursor:pointer;border:1px solid transparent;margin-bottom:2px;display:flex;align-items:center;gap:8px;transition:all .13s}
.style-item:hover{background:var(--cream);border-color:var(--border)}
.style-item.active{background:var(--navy);border-color:var(--navy2);color:#fff}
.si-icon{width:30px;height:30px;border-radius:var(--rad);background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.style-item.active .si-icon{background:rgba(255,255,255,.1)}
.si-info{flex:1;min-width:0}
.si-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-cat{font-size:11px;color:var(--text3);margin-top:1px}
.style-item.active .si-cat{color:rgba(255,255,255,.5)}
.sb-foot{padding:9px 11px;border-top:1px solid var(--border)}
.btn-new{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--rad);padding:8px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn-new:hover{background:var(--navy2)}
.sb-empty{padding:26px 13px;text-align:center;color:var(--text3);font-size:12px;line-height:1.7}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.toolbar-name{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.03em;flex:1}
.tab-group{display:flex;gap:2px}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:var(--rad);background:transparent;font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;color:var(--text2);transition:all .13s}
.tab:hover{background:var(--cream)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{padding:6px 12px;border-radius:var(--rad);border:1px solid var(--border);background:#fff;font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:5px;transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--cream);border-color:var(--border2)}
.btn-print{background:var(--gold);border-color:var(--gold2);color:#fff;font-weight:600}
.btn-print:hover{background:var(--gold2)}
.btn-del{color:var(--danger)}
.btn-del:hover{background:var(--danger-bg);border-color:#dca09a}
.content{flex:1;overflow-y:auto;padding:16px}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)}
.empty-icon{font-size:50px;opacity:.22}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text2);letter-spacing:.02em}
.empty p{font-size:13px;text-align:center;max-width:275px;line-height:1.6}
.empty-cta{background:var(--navy);color:#fff;border:none;border-radius:var(--rad);padding:9px 22px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.empty-cta:hover{background:var(--navy2)}

/* ── FORM ── */
.fsec{background:#fff;border:1px solid var(--border);border-radius:var(--rad2);padding:14px 16px;margin-bottom:11px}
.fsec-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--cream2);display:flex;align-items:center;gap:6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.f input,.f select,.f textarea{border:1px solid var(--border);border-radius:var(--rad);padding:6px 8px;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);background:var(--surface);width:100%;transition:border-color .13s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy2);background:#fff}
.f textarea{resize:vertical;min-height:60px}

/* image upload */
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:7px}
.img-slot{border:2px dashed var(--border2);border-radius:var(--rad);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .14s;background:var(--cream);position:relative;overflow:hidden;text-align:center;padding:8px}
.img-slot:hover{border-color:var(--navy2);background:var(--cream2)}
.img-slot img{max-width:100%;max-height:100%;object-fit:contain}
.img-slot .img-x{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;border:none;border-radius:3px;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
.img-slot-lbl{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}
.img-note{font-size:11px;color:var(--text3);grid-column:1/-1;line-height:1.6}

/* data table editor */
.dt-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:var(--navy);color:#fff;padding:5px 8px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.dt td{padding:2px 4px;border-bottom:1px solid var(--cream2)}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--cream)}
.dt input{border:1px solid transparent;border-radius:3px;padding:4px 5px;font-family:'Barlow',sans-serif;font-size:12px;width:100%;background:transparent;color:var(--text);transition:all .13s}
.dt input:hover{background:#fff;border-color:var(--border)}
.dt input:focus{outline:none;background:#fff;border-color:var(--navy2)}
.th-input{color:#fff!important;background:transparent!important;font-size:10px!important;border-color:transparent!important}
.th-input:hover{background:rgba(255,255,255,.15)!important;border-color:rgba(255,255,255,.3)!important}
.th-input:focus{background:rgba(255,255,255,.2)!important;border-color:rgba(255,255,255,.5)!important;outline:none}
.icon-del{background:none;border:none;cursor:pointer;padding:3px;border-radius:3px;color:var(--text3);font-size:12px;display:flex;align-items:center;transition:all .13s}
.icon-del:hover{background:var(--danger-bg);color:var(--danger)}
.add-row{margin-top:7px;width:100%;background:var(--cream);border:1px dashed var(--border2);border-radius:var(--rad);padding:5px 11px;font-size:12px;font-family:'Barlow',sans-serif;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .13s}
.add-row:hover{background:var(--cream2);border-color:var(--navy2);color:var(--navy)}
.row-btns{display:flex;gap:7px;margin-top:7px}
.row-btns .add-row{margin-top:0}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.5);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--rad2);padding:22px;width:370px;box-shadow:0 4px 24px rgba(15,38,64,.18);border:1px solid var(--border)}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:14px}
.modal-fields{display:flex;flex-direction:column;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}
.btn-cancel{padding:7px 15px;border:1px solid var(--border);border-radius:var(--rad);background:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text2)}
.btn-cancel:hover{background:var(--cream)}
.btn-ok{padding:7px 19px;border:none;border-radius:var(--rad);background:var(--navy);color:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600}
.btn-ok:hover{background:var(--navy2)}

/* ══════════════════════════════════════════════════
   SPEC SHEET — faithfully matches the reference PNG
══════════════════════════════════════════════════ */
.spec-wrap{background:var(--bg);border-radius:var(--rad2);padding:16px;overflow-x:auto}

.spec{
  background:#fff;
  width:1050px;
  margin:0 auto;
  border:2px solid #444;
  font-family:Arial,Helvetica,sans-serif;
  color:#111;
  display:flex;
  flex-direction:column;
  font-size:11px;
  font-weight:bold;
  height:780px;
}

/* TOP BAND: diagram(s) left | dims+notes right */
.spec-top{
  display:flex;
  border-bottom:2px solid #444;
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* LEFT: diagram image area */
.spec-img-panel{
  flex:1;
  border-right:2px solid #444;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  gap:10px;
  background:#fff;
  position:relative;
  overflow:hidden;
  min-height:0;
}
.spec-img-panel img{
  display:block;
  object-fit:contain;
  width:48%;
  height:100%;
  max-height:100%;
  flex:none;
}
.spec-img-panel.one img{
  width:96%;
  height:100%;
  max-height:100%;
}
.spec-img-panel.two img:first-child{
  width:60%;
  height:100%;
  max-height:100%;
}
.spec-img-panel.two img:last-child{
  width:38%;
  height:100%;
  max-height:100%;
}
.spec-img-divider{ height:100%; border-left:1px dashed #bbb; align-self:stretch; }
.spec-img-empty{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;color:#bbb;font-size:11px;font-style:italic;
  border:2px dashed #ccc;border-radius:4px;
  position:absolute;inset:8px;
}

/* RIGHT: dims + notes stacked — same fixed width */
.spec-right{
  width:290px;
  min-width:290px;
  display:flex;
  flex-direction:column;
  border-left:none;
}

/* ── DIMENSIONS block ── */
.spec-dims-block{
  border-bottom:2px solid #444;
  padding:6px 7px 6px;
}
.spec-block-title{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  text-decoration:underline;
  letter-spacing:.05em;
  margin-bottom:4px;
  text-transform:uppercase;
}
.spec-dims-title{ color:#cc0000; }
.spec-notes-title{ color:#0000cc; }

/* Shared table: dims and notes use IDENTICAL column widths */
.spec-rt{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.spec-rt th, .spec-rt td{
  border:1px solid #888;
  padding:3px 2px;
  text-align:center;
  overflow:hidden;
  white-space:nowrap;
}
.spec-rt col.c-item{ width:62px; }
.spec-rt col.c-data { width:1fr; }

/* Dimension header row */
.spec-rt thead.dim-head th{
  background:#fff;
  font-size:12px;
  font-weight:bold;
  line-height:1.3;
}
.spec-rt thead.dim-head th.item-hdr{
  color:#cc0000;
  font-weight:bold;
}
/* dimension data rows */
.spec-rt tbody.dim-body td{
  font-size:14px;
  font-weight:bold;
}
.spec-rt tbody.dim-body td.item-cell{
  color:#cc0000;
  font-weight:bold;
}
.spec-rt tbody.dim-body td.hi{
  background:none;
  color:#cc0000;
  font-weight:bold;
}

/* ── NOTES block ── */
.spec-notes-block{
  flex:1;
  padding:6px 7px 5px;
  display:flex;
  flex-direction:column;
}
/* Notes header row */
.spec-rt thead.note-head th{
  background:#fff;
  font-size:12px;
  font-weight:bold;
}
.spec-rt thead.note-head th.code-hdr{
  color:#0000cc;
  font-weight:bold;
  text-align:left;
  padding-left:4px;
}
/* note data rows */
.spec-rt tbody.note-body td{
  font-size:14px;
  font-weight:bold;
}
.spec-rt tbody.note-body td.code-cell{
  color:#0000cc;
  font-weight:bold;
  text-align:left;
  padding-left:4px;
}
.spec-extra-note{
  font-size:10px;
  color:#cc0000;
  font-style:italic;
  text-align:right;
  margin-top:4px;
  padding-right:2px;
}

/* ── MATERIALS band ── */
.spec-mats{
  border-top:2px solid #444;
  padding:5px 7px 7px;
  flex-shrink:0;
}
.spec-mats-title{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  text-decoration:none;
  letter-spacing:.05em;
  margin-bottom:4px;
}
.spec-mt{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}
.spec-mt col.mc-item{ width:40px; }
.spec-mt col.mc-qty { width:72px; }
.spec-mt col.mc-code{ width:110px; }
.spec-mt col.mc-desc{ width:auto; }

.spec-mt th{
  background:#fff;
  color:#000;
  padding:3px 6px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  letter-spacing:.05em;
  border:1px solid #aaa;
}
.spec-mt td{
  padding:4px 6px;
  border:1px solid #ccc;
  vertical-align:middle;
  height:25px;
}
.spec-mt tr:nth-child(even) td{ background:#f6f6f6; }
.spec-mt th.th-item{ color:#0000cc; }
.spec-mt td.m-item{ font-weight:bold; color:#0000cc; text-align:center; }
.spec-mt td.m-qty { text-align:center; white-space:normal; word-break:break-word; }
.spec-mt td.m-qty-note{ text-align:center; color:#0000cc; font-size:11px; white-space:normal; word-break:break-word; }
.spec-mt td.m-code{ text-align:center; }
.spec-mt td.m-code-blue{ color:#0000cc; font-size:12px; text-align:center; }
.spec-mt td.m-note{ color:#cc0000; font-size:12px; }

/* ── FOOTER BANNER ── */
.spec-footer{
  background:#fff;
  border-top:2px solid #444;
  display:flex;
  align-items:stretch;
  min-height:72px;
  flex-shrink:0;
}
.spec-footer-left{
  flex:1;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  padding:6px 20px;
  border-right:2px solid #444;
  gap:20px;
}
.spec-series-script{
  font-family:'Dancing Script','Barlow Condensed',cursive;
  font-size:42px;
  font-weight:700;
  color:#fff;
  letter-spacing:.02em;
  line-height:1.2;
  white-space:nowrap;
  background:linear-gradient(135deg, #0f2640 60%, #1a3a5c 100%);
  padding:6px 22px 6px 16px;
  border-radius:4px;
  box-shadow:2px 2px 6px rgba(0,0,0,.25);
  clip-path:polygon(0 0, 100% 0, 96% 100%, 0 100%);
  text-shadow:1px 1px 3px rgba(0,0,0,.4);
}
.spec-subtitle{
  font-size:11px;
  color:#333;
  font-style:italic;
  line-height:1.6;
  text-align:left;
  border:1px solid #aaa;
  padding:5px 10px;
  border-radius:3px;
  margin-right:auto;
  margin-left:30px;
}
.spec-footer-mid{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6px 12px;
  border-right:2px solid #444;
  gap:2px;
  min-width:72px;
}
.spec-page-lbl{ font-size:9px; font-weight:bold; color:#555; letter-spacing:.07em; text-transform:uppercase; }
.spec-page-val{ font-size:14px; font-weight:bold; color:#111; }
.spec-footer-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6px 14px;
  gap:2px;
  min-width:160px;
  position:relative;
  border:none;
}
.spec-logo-img{ max-width:160px; max-height:64px; object-fit:contain; background:transparent; }
.spec-logo-script{
  font-family:'Dancing Script',cursive;
  font-size:28px;
  font-weight:700;
  color:#111;
}
.spec-website{ font-size:9px; color:#555; }
.spec-year{ font-size:8px; color:#aaa; position:absolute; bottom:3px; right:5px; }

/* ── BANNER COLOR VARIANTS ── */
/* Green — Wood Shop: angled right edge (ribbon flag) */
.banner-green .spec-series-script{
  background:linear-gradient(135deg,#1a5c2a 60%,#2d8a42 100%);
  clip-path:polygon(0 0, 100% 0, 96% 100%, 0 100%);
}
/* Blue — Metal Shop: parallelogram (industrial slant) */
.banner-blue .spec-series-script{
  background:linear-gradient(135deg,#1a4a7a 60%,#2a6aaa 100%);
  clip-path:polygon(3% 0, 100% 0, 97% 100%, 0 100%);
}
/* Pink — Gate Shop: arch/scallop top-right corner */
.banner-pink .spec-series-script{
  background:linear-gradient(135deg,#8c1a4a 60%,#c42d6e 100%);
  clip-path:polygon(0 0, 92% 0, 100% 30%, 100% 100%, 0 100%);
}
/* Orange — Gear Shop: double-notch chevron */
.banner-orange .spec-series-script{
  background:linear-gradient(135deg,#c45a00 60%,#e87a10 100%);
  clip-path:polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
}

/* ── PRINT ── */
@media print{
  body{overflow:visible!important;height:auto!important;background:#fff!important}
  .app-bar,.sidebar,.toolbar{display:none!important}
  .app-body{display:block}
  .main{display:block;overflow:visible}
  .content{padding:0;overflow:visible}
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  .spec-wrap{
    padding:0;background:none;border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spec{
    width:100%!important;
    height:780px!important;
    min-height:0!important;
    box-shadow:none!important;
    border:2px solid #444!important;
  }
  .spec-top{ min-height:0!important; flex:1!important; }
  @page{size:11in 8.5in landscape;margin:4mm}
}

/* ── MIRRORED EDIT LAYOUT ── */
.edit-mirror{
  background:#fff;border:2px solid #444;
  font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:bold;color:#111;

.edit-mirror-top{display:flex;border-bottom:2px solid #444;min-height:460px;}
.edit-mirror-left{

  padding:8px 10px;gap:8px;background:#fff;overflow:hidden;
}
.edit-mirror-left .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;}
.edit-mirror-left .img-slot{min-height:200px;}
.edit-mirror-right{width:290px;min-width:290px;display:flex;flex-direction:column;}
.edit-mirror-dims{border-bottom:2px solid #444;padding:6px 7px;}
.edit-mirror-notes{flex:1;padding:6px 7px;display:flex;flex-direction:column;}
.em-block-title{text-align:center;font-size:12px;font-weight:bold;text-decoration:underline;letter-spacing:.05em;margin-bottom:4px;text-transform:uppercase;}
.em-dims-title{color:#cc0000;}
.em-notes-title{color:#0000cc;}
.em-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;}
.em-table th,.em-table td{border:1px solid #888;padding:1px 2px;text-align:center;overflow:hidden;}
.em-table col.ec-item{width:52px;}.em-table col.ec-data{width:auto;}
.em-table thead th{background:#fff;font-size:10px;font-weight:bold;}
.em-table thead th.em-item-hdr{color:#cc0000;}
.em-table thead th.em-code-hdr{color:#0000cc;text-align:left;padding-left:3px;}
.em-table tbody td{font-size:11px;}
.em-table tbody td.em-item-cell{color:#cc0000;}
.em-table tbody td.em-code-cell{color:#0000cc;text-align:left;padding-left:3px;}
.em-table input{border:1px solid transparent;border-radius:2px;padding:2px 3px;font-family:Arial,sans-serif;font-size:10px;width:100%;background:transparent;color:inherit;font-weight:bold;transition:all .13s;}
.em-table input:hover{background:#fffbe8;border-color:#ccc;}
.em-table input:focus{outline:none;background:#fff;border-color:#0050cc;}
.em-table th input{color:inherit;font-size:9px;background:transparent;border-color:transparent;}
.em-table th input:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2);}
.em-table th input:focus{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.4);outline:none;}
.em-extra-note{font-size:9px;color:#cc0000;font-style:italic;text-align:right;margin-top:3px;}
.em-extra-note input{font-size:9px;color:#cc0000;font-style:italic;background:transparent;border:1px solid transparent;width:100%;font-weight:normal;text-align:right;}
.em-extra-note input:focus{background:#fff;border-color:#cc0000;outline:none;}
.edit-mirror-mats{border-top:2px solid #444;padding:4px 7px 6px;}

.em-mat-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;}
.em-mat-table col.mc2-item{width:36px;}.em-mat-table col.mc2-qty{width:58px;}.em-mat-table col.mc2-code{width:108px;}.em-mat-table col.mc2-desc{width:auto;}.em-mat-table col.mc2-del{width:20px;}
.em-mat-table th{background:#fff;color:#000;padding:2px 4px;text-align:center;font-size:10px;font-weight:bold;letter-spacing:.04em;border:1px solid #aaa;}

.em-mat-table td{padding:3px 4px;border:1px solid #ccc;vertical-align:top;height:auto;min-height:44px;}
.em-mat-table tr:nth-child(even) td{background:#f8f8f8;}
.em-mat-table td.em2-item{color:#0000cc;font-weight:bold;text-align:center;}
.em-mat-table td.em2-code-blue{color:#0000cc;font-size:10px;text-align:center;}
.em-mat-table input{border:1px solid transparent;border-radius:2px;padding:1px 3px;font-family:Arial,sans-serif;font-size:10px;width:100%;background:transparent;color:inherit;font-weight:bold;transition:all .13s;}
.em-mat-table input:hover{background:#fffbe8;border-color:#ccc;}
.em-mat-table input:focus{outline:none;background:#fff;border-color:#0050cc;}
.em-check-row{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:normal;margin-top:1px;}
.em-check-row input[type=checkbox]{width:10px;height:10px;}
.edit-mirror-footer{background:#fff;border-top:2px solid #444;display:flex;align-items:stretch;min-height:70px;flex-shrink:0;}
.em-footer-left{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:5px 16px;border-right:2px solid #444;gap:12px;}
.em-series-script{font-family:'Dancing Script','Barlow Condensed',cursive;font-size:38px;font-weight:700;color:#fff;letter-spacing:.02em;background:linear-gradient(135deg,#0f2640 60%,#1a3a5c 100%);padding:5px 18px 5px 12px;border-radius:3px;box-shadow:2px 2px 5px rgba(0,0,0,.22);white-space:nowrap;clip-path:polygon(0 0,100% 0,96% 100%,0 100%);}
.em-series-script input{font-family:'Dancing Script','Barlow Condensed',cursive;font-size:38px;font-weight:700;color:#fff;letter-spacing:.02em;background:transparent;border:none;outline:none;text-shadow:1px 1px 2px rgba(0,0,0,.35);min-width:100px;}
.em-footer-right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 12px;gap:2px;min-width:160px;}
.em-footer-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 10px;border-right:2px solid #444;gap:1px;min-width:68px;}
.em-page-lbl{font-size:8px;font-weight:bold;color:#555;letter-spacing:.07em;}
.em-page-val input{font-size:13px;font-weight:bold;color:#111;text-align:center;background:transparent;border:1px solid transparent;width:60px;}
.em-page-val input:focus{background:#fff;border-color:#0050cc;outline:none;}

.em-row-actions button:hover{background:var(--cream2);border-color:var(--navy2);color:var(--navy);}

.em-row-actions button.del:hover{background:var(--danger-bg);border-color:#dca09a;}
.banner-green .em-series-script{background:linear-gradient(135deg,#1a5c2a 60%,#2d8a42 100%);clip-path:polygon(0 0,100% 0,96% 100%,0 100%);}
.banner-blue .em-series-script{background:linear-gradient(135deg,#1a4a7a 60%,#2a6aaa 100%);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);}

.banner-orange .em-series-script{background:linear-gradient(135deg,#c45a00 60%,#e87a10 100%);clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);}
.edit-mirror-info{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad2);padding:12px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 16px;}
.em-field{display:flex;flex-direction:column;gap:3px;}
.em-field label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.em-field input,.em-field select,.em-field textarea{border:1px solid var(--border);border-radius:var(--rad);padding:5px 7px;font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);background:var(--surface);width:100%;}
.em-field input:focus,.em-field select:focus,.em-field textarea:focus{outline:none;border-color:var(--navy2);background:#fff;}
.em-field.full{grid-column:1/-1;}
.em-wrap{background:var(--bg);border-radius:var(--rad2);padding:16px;overflow-x:auto;margin-bottom:12px;}

<body>

<div class="app-bar">
  <div class="app-logo">🏗 Fence<em>Spec</em> Pro</div>
  <div class="app-div"></div>
  <div class="app-sub">Spec Sheet Generator</div>
  <div class="spacer"></div>
  <button class="app-btn gold" id="globalPrint" onclick="doPrint()" style="display:none">🖨 Print / Save PDF</button>
</div>

<div class="app-body">
  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-label">🏗 Fence Styles</div>
      <div class="sb-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search styles..." id="sbSearch" oninput="filterList()"/>
      </div>
    </div>
    <div class="style-list" id="styleList"></div>
    <div class="sb-foot">
      <button class="btn-new" onclick="openModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New Fence Style
      </button>
    </div>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-name" id="toolbarName"></div>
      <div class="tab-group">
        <button class="tab on" id="tEdit" onclick="goTab('edit')">✏️ Edit</button>
        <button class="tab" id="tPreview" onclick="goTab('preview')">👁 Preview</button>
      </div>
      <button class="btn btn-print" onclick="doPrint()">🖨 Print / PDF</button>
      <button class="btn btn-del" onclick="delStyle()">🗑 Delete</button>
    </div>
    <div class="content" id="mainContent">
      <div class="empty">
        <div class="empty-icon">🔩</div>
        <h2>No Style Selected</h2>
        <p>Create a fence style, upload your diagrams, and generate a printable spec sheet.</p>
        <button class="empty-cta" onclick="openModal()">+ Create First Style</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">New Fence Style</div>
    <div class="modal-fields">
      <div class="f"><label>Style Name</label><input id="mName" type="text" placeholder="e.g. Wood Illinois Scalloped" onkeydown="if(event.key==='Enter')doCreate()"/></div>
      <div class="f"><label>Series (footer banner text)</label><input id="mSeries" type="text" placeholder="e.g. Wood Illinois Scalloped Series" onkeydown="if(event.key==='Enter')doCreate()"/></div>
      <div class="f"><label>Page Code (e.g. WIL3)</label><input id="mCat" type="text" placeholder="e.g. WIL3" onkeydown="if(event.key==='Enter')doCreate()"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-ok" onclick="doCreate()">Create</button>
    </div>
  </div>
</div>

// ── SIDEBAR ──
function filterList(){ filt=document.getElementById('sbSearch').value.toLowerCase(); renderSB(); }
function renderSB(){
  const el=document.getElementById('styleList');
  const vis=S.filter(s=>s.name.toLowerCase().includes(filt)||(s.series||'').toLowerCase().includes(filt));
  if(!vis.length){ el.innerHTML='<div class="sb-empty">No styles yet.<br>Click "New Fence Style" below.</div>'; return; }
  el.innerHTML=vis.map(s=>`
    <div class="style-item ${s.id===cid?'active':''}" onclick="pick('${s.id}')">
      <div class="si-icon">🔩</div>
      <div class="si-info">
        <div class="si-name">${esc(s.name)}</div>
        <div class="si-cat">${esc(s.cat||s.series||'—')}</div>
      </div>
    </div>`).join('');
}

function pick(id){
  cid=id; ctab='edit';
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('globalPrint').style.display='';
  document.getElementById('toolbarName').textContent=cur().name;
  document.getElementById('tEdit').classList.add('on');
  document.getElementById('tPreview').classList.remove('on');
  renderSB(); renderEdit();
}

// ── MODAL ──
function openModal(){ document.getElementById('mName').value=''; document.getElementById('mSeries').value=''; document.getElementById('mCat').value=''; document.getElementById('modal').style.display='flex'; setTimeout(()=>document.getElementById('mName').focus(),40); }
function closeModal(){ document.getElementById('modal').style.display='none'; }
function doCreate(){
  const name=(document.getElementById('mName').value.trim()||'Unnamed Style');
  const series=document.getElementById('mSeries').value.trim();
  const cat=document.getElementById('mCat').value.trim();
  const id='s'+Date.now();
  S.push(defaultStyle(id,name,series||name,cat));
  save(); closeModal(); pick(id);
}
function delStyle(){
  if(!cid)return;
  if(!confirm(`Delete "${cur().name}"?`))return;
  S=S.filter(x=>x.id!==cid); cid=null; save(); renderSB();
  document.getElementById('toolbar').style.display='none';
  document.getElementById('globalPrint').style.display='none';
  document.getElementById('mainContent').innerHTML=`<div class="empty"><div class="empty-icon">🔩</div><h2>No Style Selected</h2><p>Select or create a fence style.</p><button class="empty-cta" onclick="openModal()">+ Create Style</button></div>`;
}

// ── TABS ──
function goTab(t){ ctab=t; document.getElementById('tEdit').classList.toggle('on',t==='edit'); document.getElementById('tPreview').classList.toggle('on',t==='preview'); if(t==='edit')renderEdit();else renderPreview(); }

// ── IMAGES ──
function loadImg(slot,e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{ const t=cur();if(!t)return; t['img'+slot]=ev.target.result; save(); ctab==='edit'?renderEdit():renderPreview(); };
  r.readAsDataURL(f); e.target.value='';
}
function clearImg(slot){ const t=cur();if(!t)return; t['img'+slot]=null; save(); ctab==='edit'?renderEdit():renderPreview(); }
function loadLogo(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{ logo=ev.target.result; localStorage.setItem('fsp4_logo',logo); ctab==='edit'?renderEdit():renderPreview(); };
  r.readAsDataURL(f); e.target.value='';
}

// ── EDIT VIEW ──
function renderEdit(){
  const t=cur();if(!t)return;
  const n=t.numDataCols||5;

  // colgroup
  const cg=`<colgroup><col class="ec-item"/>${Array(n).fill('<col class="ec-data"/>').join('')}<col style="width:24px"/></colgroup>`;

  // Dims header inputs
  const dimThead=`<thead><tr>
    <th class="em-item-hdr">ITEM</th>
    ${Array.from({length:n},(_,i)=>`<th>
      <input type="text" value="${esc(t.dimColLabels[i]||'')}" oninput="updDimColLabel(${i},this.value)" placeholder="label"/>
      <input type="text" value="${esc(t.dimColSubs[i]||'')}" oninput="updDimColSub(${i},this.value)" placeholder="sub" style="font-size:8px;opacity:.8;margin-top:1px"/>
    </th>`).join('')}
    <th></th>
  </tr></thead>`;

  const dimTbody=`<tbody>${t.dimRows.map((r,ri)=>`
    <tr>
      <td class="em-item-cell"><input type="text" value="${esc(r.item)}" oninput="updDimRowItem(${ri},this.value)" style="width:38px"/></td>
      ${Array.from({length:n},(_,j)=>`<td><input type="text" value="${esc((r.vals||[])[j]||'')}" oninput="updDimVal(${ri},${j},this.value)"/></td>`).join('')}
      <td><button class="icon-del" onclick="remDimRow(${ri})" title="Delete row" style="font-size:10px;padding:1px 3px">✕</button></td>
    </tr>`).join('')}</tbody>`;

  // Notes header inputs (same n cols)
  const noteThead=`<thead><tr>
    <th class="em-code-hdr"><input type="text" value="${esc(t.noteFirstCol||'Code')}" oninput="u('noteFirstCol',this.value)" style="width:48px"/></th>
    ${Array.from({length:n},(_,i)=>`<th><input type="text" value="${esc(t.noteColLabels[i]||'')}" oninput="updNoteColLabel(${i},this.value)"/></th>`).join('')}
    <th></th>
  </tr></thead>`;

  const noteTbody=`<tbody>${t.noteRows.map((r,ri)=>`
    <tr>
      <td class="em-code-cell"><input type="text" value="${esc(r.code)}" oninput="updNoteCode(${ri},this.value)" style="width:48px"/></td>
      ${Array.from({length:n},(_,j)=>`<td><input type="text" value="${esc((r.vals||[])[j]||'')}" oninput="updNoteVal(${ri},${j},this.value)"/></td>`).join('')}
      <td><button class="icon-del" onclick="remNoteRow(${ri})" title="Delete row" style="font-size:10px;padding:1px 3px">✕</button></td>
    </tr>`).join('')}</tbody>`;

  // Materials
  const matRows=t.materials.map((m,mi)=>`
    <tr>
      <td class="em2-item"><input type="text" value="${esc(m.item)}" oninput="updMat(${mi},'item',this.value)"/></td>
      <td style="text-align:center;vertical-align:top">
        <input type="text" value="${esc(m.qty)}" oninput="updMat(${mi},'qty',this.value)"/>
        <label class="em-check-row" style="color:#0000cc"><input type="checkbox" ${m.qty==='See notes'?'checked':''} onchange="updMat(${mi},'qty',this.checked?'See notes':'');renderEdit()"/> See notes</label>
      </td>
      <td class="${m.codeBlue?'em2-code-blue':''}">
        <input type="text" value="${esc(m.code)}" oninput="updMat(${mi},'code',this.value)"/>
        <label class="em-check-row" style="color:#0000cc"><input type="checkbox" ${m.code==='See notes'?'checked':''} onchange="(()=>{updMat(${mi},'code',this.checked?'See notes':'');updMat(${mi},'codeBlue',this.checked);renderEdit()})()"/> See notes</label>
      </td>
      <td>
        <input type="text" value="${esc(m.desc)}" oninput="updMat(${mi},'desc',this.value)"/>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;">
          <label class="em-check-row" style="color:#0000cc"><input type="checkbox" ${m.descNote?'checked':''} onchange="setMatAppend(${mi},'note',this.checked)"/> See Notes</label>
          ${t.dimRows.map((dr,dri)=>`<label class="em-check-row" style="color:#555"><input type="checkbox" ${(Number(m.seeItem)===(dri+1))?'checked':''} onchange="setMatAppend(${mi},'item',${dri+1},this.checked)"/> See item ${esc(dr.item||String(dri+1))}</label>`).join('')}
        </div>
      </td>
      <td><button class="icon-del" onclick="remMat(${mi})" title="Delete">✕</button></td>
    </tr>`).join('');

  // Images
  const img1Html=t.img1
    ?`<div class="img-slot" style="cursor:default"><img src="${t.img1}" alt="Diagram 1"/><button class="img-x" onclick="clearImg(1)">✕</button></div>`
    :`<div class="img-slot" onclick="document.getElementById('imgInput1').click()"><span style="font-size:22px;opacity:.22">🖼</span><div class="img-slot-lbl">Click to upload<br/><b>Diagram Image 1</b></div></div>`;
  const img2Html=t.img2
    ?`<div class="img-slot" style="cursor:default"><img src="${t.img2}" alt="Diagram 2"/><button class="img-x" onclick="clearImg(2)">✕</button></div>`
    :`<div class="img-slot" onclick="document.getElementById('imgInput2').click()"><span style="font-size:22px;opacity:.22">🖼</span><div class="img-slot-lbl">Click to upload<br/><b>Diagram Image 2</b> (optional)</div></div>`;

  // Logo / company in footer (same logic as preview)
  const footerRight = (!t.noLogo && logo)
    ? `<img src="${logo}" alt="logo" class="spec-logo-img"/><div class="spec-website" style="font-size:9px;color:#555">${esc(t.website||'')}</div>`
    : `<div class="spec-logo-script">${esc(t.company||'')}</div><div style="font-size:9px;color:#555">${esc(t.website||'')}</div>`;

  // Info strip (company settings above the mirror)
  const infoStrip=`
    <div class="edit-mirror-info">
      <div class="em-field"><label>Company</label><input type="text" value="${esc(t.company)}" oninput="u('company',this.value)"/></div>
      <div class="em-field"><label>Website</label><input type="text" value="${esc(t.website)}" oninput="u('website',this.value)"/></div>
      <div class="em-field"><label>Banner Color / Shop</label>
        <select onchange="u('banner',this.value)">
          <option value="green"  ${t.banner==='green' ?'selected':''}>🟢 Green — Wood Shop</option>
          <option value="blue"   ${t.banner==='blue'  ?'selected':''}>🔵 Blue — Metal Shop</option>
          <option value="pink"   ${t.banner==='pink'  ?'selected':''}>🩷 Pink — Gate Shop</option>
          <option value="orange" ${t.banner==='orange'?'selected':''}>🟠 Orange — Gear Shop</option>
        </select>
      </div>
      <div class="em-field"><label>Style Name</label><input type="text" value="${esc(t.name)}" oninput="u('name',this.value)"/></div>
      <div class="em-field"><label>Series (footer script)</label><input type="text" value="${esc(t.series)}" oninput="u('series',this.value)"/></div>
      <div class="em-field"><label>Page Code</label><input type="text" value="${esc(t.cat)}" oninput="u('cat',this.value)"/></div>
      <div class="em-field full" style="flex-direction:row;align-items:center;gap:12px;">
        <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
          <label>Logo</label>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="img-slot" style="width:120px;min-height:40px;padding:4px" onclick="document.getElementById('logoInput').click()">
              ${logo?`<img src="${logo}" alt="logo" style="max-height:36px"/>` :'<div style="font-size:10px;color:#aaa">Click to upload logo</div>'}
            </div>
            <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:400;cursor:pointer;color:var(--text)">
              <input type="checkbox" ${t.noLogo?'checked':''} onchange="u('noLogo',this.checked)" style="width:14px;height:14px"/>
              Hide logo on this sheet
            </label>
          </div>
        </div>
      </div>
    </div>`;

  // Column action buttons
  const colBtns=`<div class="em-row-actions" style="margin-top:5px">
    <button onclick="addDimRow()">+ Dim Row</button>
    <button onclick="addNoteRow()">+ Note Row</button>
    <button onclick="addCol()">+ Column (both)</button>
    <button onclick="removeCol()">− Last Column</button>
  </div>`;

  document.getElementById('mainContent').innerHTML=`
  ${infoStrip}
  <div class="em-wrap">
    <div class="edit-mirror banner-${t.banner||'blue'}">

      <!-- TOP: image left | dims+notes right -->
      <div class="edit-mirror-top">
        <div class="edit-mirror-left">
          <div class="img-grid">
            ${img1Html}
            ${img2Html}
          </div>
        </div>

        <div class="edit-mirror-right">
          <!-- DIMENSIONS -->
          <div class="edit-mirror-dims">
            <div class="em-block-title em-dims-title">DIMENSIONS</div>
            <table class="em-table">${cg}${dimThead}${dimTbody}</table>
            <div style="display:flex;gap:4px;margin-top:4px;">
              <button onclick="addDimRow()" style="flex:1;background:#f0ebe0;border:1px dashed #b0aca4;border-radius:4px;padding:3px 6px;font-size:10px;cursor:pointer;color:#4a4540;">+ Row</button>
              <button onclick="addCol()" style="flex:1;background:#f0ebe0;border:1px dashed #b0aca4;border-radius:4px;padding:3px 6px;font-size:10px;cursor:pointer;color:#4a4540;">+ Col</button>
              <button onclick="removeCol()" style="flex:1;background:#f0ebe0;border:1px dashed #b0aca4;border-radius:4px;padding:3px 6px;font-size:10px;cursor:pointer;color:#b53528;">− Col</button>
            </div>
          </div>
          <!-- NOTES -->
          <div class="edit-mirror-notes">
            <div class="em-block-title em-notes-title">NOTES</div>
            <table class="em-table">${cg}${noteThead}${noteTbody}</table>
            <div class="em-extra-note"><input type="text" value="${esc(t.extraNote)}" oninput="u('extraNote',this.value)" placeholder="Extra note (red italic)…"/></div>
            <div style="margin-top:4px;">
              <button onclick="addNoteRow()" style="width:100%;background:#f0ebe0;border:1px dashed #b0aca4;border-radius:4px;padding:3px 6px;font-size:10px;cursor:pointer;color:#4a4540;">+ Note Row</button>
            </div>
          </div>
        </div>
      </div>

      <!-- MATERIALS -->
      <div class="edit-mirror-mats">
        <div class="edit-mirror-mats-title">MATERIALS</div>
        <table class="em-mat-table">
          <colgroup><col class="mc2-item"/><col class="mc2-qty"/><col class="mc2-code"/><col class="mc2-desc"/><col class="mc2-del"/></colgroup>
          <thead><tr>
            <th class="th2-item">ITEM</th><th>QTY</th><th>CODE</th><th>DESCRIPTION</th><th></th>
          </tr></thead>
          <tbody>${matRows}</tbody>
        </table>
        <div class="em-row-actions"><button onclick="addMatRow()">+ Add Material Row</button></div>
      </div>

      <!-- FOOTER BANNER -->
      <div class="edit-mirror-footer">
        <div class="em-footer-left">
          <div class="em-series-script"><input type="text" value="${esc(t.series||t.name||'')}" oninput="u('series',this.value)"/></div>
          <div class="em-subtitle-wrap">
            <textarea oninput="u('subtitle',this.value)" placeholder="Subtitle (use \\n for line break)…">${esc(t.subtitle||'')}</textarea>
          </div>
        </div>
        <div class="em-footer-mid">
          <div class="em-page-lbl">PAGE</div>
          <div class="em-page-val"><input type="text" value="${esc(t.cat||'')}" oninput="u('cat',this.value)" placeholder="—"/></div>
        </div>
        <div class="em-footer-right">${footerRight}</div>
      </div>

    </div>
  </div>
  ${colBtns}`;
}
// ── FIELD UPDATERS ──
function u(k,v){ const t=cur();if(!t)return;t[k]=v;save();if(k==='name'){document.getElementById('toolbarName').textContent=v;renderSB();} }
function updDimColLabel(i,v){ const t=cur();if(t){t.dimColLabels[i]=v;save();} }
function updDimColSub(i,v){ const t=cur();if(t){t.dimColSubs[i]=v;save();} }
function updDimRowItem(i,v){ const t=cur();if(t&&t.dimRows[i]){t.dimRows[i].item=v;save();} }
function updDimVal(i,j,v){ const t=cur();if(t&&t.dimRows[i]){t.dimRows[i].vals[j]=v;save();} }
function updNoteColLabel(i,v){ const t=cur();if(t){t.noteColLabels[i]=v;save();} }
function updNoteCode(i,v){ const t=cur();if(t&&t.noteRows[i]){t.noteRows[i].code=v;save();} }
function updNoteVal(i,j,v){ const t=cur();if(t&&t.noteRows[i]){t.noteRows[i].vals[j]=v;save();} }
function updMat(i,k,v){ const t=cur();if(t&&t.materials[i]){t.materials[i][k]=v;save();} }
function setMatAppend(mi,type,valOrChecked,checked){
  const t=cur();if(!t||!t.materials[mi])return;
  const m=t.materials[mi];
  if(type==='note'){
    // checking note clears seeItem
    m.descNote=valOrChecked;
    if(valOrChecked) m.seeItem=0;
  } else {
    // type==='item', valOrChecked is the item number, checked is the bool
    if(checked){
      m.seeItem=Number(valOrChecked);
      m.descNote=false;
    } else {
      if(Number(m.seeItem)===Number(valOrChecked)) m.seeItem=0;
    }
  }
  save(); renderEdit();
}

function addDimRow(){ const t=cur();if(!t)return; t.dimRows.push({item:String(t.dimRows.length+1),vals:Array(t.numDataCols).fill(''),hiCols:[]}); save();renderEdit(); }
function remDimRow(i){ const t=cur();if(t){t.dimRows.splice(i,1);save();renderEdit();} }
function addNoteRow(){ const t=cur();if(!t)return; t.noteRows.push({code:'',vals:Array(t.numDataCols).fill('')}); save();renderEdit(); }
function remNoteRow(i){ const t=cur();if(t){t.noteRows.splice(i,1);save();renderEdit();} }
function addCol(){
  const t=cur();if(!t)return;
  t.numDataCols=(t.numDataCols||5)+1;
  t.dimColLabels.push(''); t.dimColSubs.push('');
  t.dimRows.forEach(r=>r.vals.push(''));
  t.noteColLabels.push('');
  t.noteRows.forEach(r=>r.vals.push(''));
  save();renderEdit();
}
function removeCol(){
  const t=cur();if(!t||t.numDataCols<=1)return;
  t.numDataCols--;
  t.dimColLabels.pop(); t.dimColSubs.pop();
  t.dimRows.forEach(r=>r.vals.pop());
  t.noteColLabels.pop();
  t.noteRows.forEach(r=>r.vals.pop());
  save();renderEdit();
}
function addMatRow(){
  const t=cur();if(!t)return;
  const items='ABCDEFGHIJKLMNOP';
  t.materials.push({item:items[t.materials.length]||'',qty:'',code:'',desc:'',codeBlue:false,descNote:false,seeItem:0});
  save();renderEdit();
}
function remMat(i){ const t=cur();if(t){t.materials.splice(i,1);save();renderEdit();} }

// ── PREVIEW ──
function renderPreview(){
  const t=cur();if(!t)return;
  const n=t.numDataCols||5;
  const hasImg1=!!t.img1, hasImg2=!!t.img2;

  // colgroup for consistent column widths across dims and notes
  // col 0 = item (44px fixed), remaining n cols = equal share
  const colGroup=`<colgroup><col class="c-item"/>${Array(n).fill('<col class="c-data"/>').join('')}</colgroup>`;

  // Dims table
  const dimHead=`
    <thead class="dim-head">
      <tr>
        <th class="item-hdr">ITEM</th>
        ${Array.from({length:n},(_,i)=>`<th>${esc(t.dimColLabels[i]||'')}<br/><span style="font-weight:normal;font-size:11px">${esc(t.dimColSubs[i]||'')}</span></th>`).join('')}
      </tr>
    </thead>`;
  const dimBody=`
    <tbody class="dim-body">
      ${t.dimRows.map((r,ri)=>`
        <tr>
          <td class="item-cell">${esc(r.item)}</td>
          ${Array.from({length:n},(_,j)=>`<td>${esc((r.vals||[])[j]||'')}</td>`).join('')}
        </tr>`).join('')}
    </tbody>`;

  // Notes table
  const noteHead=`
    <thead class="note-head">
      <tr>
        <th class="code-hdr">${esc(t.noteFirstCol||'Code')}</th>
        ${Array.from({length:n},(_,i)=>`<th>${esc(t.noteColLabels[i]||'')}</th>`).join('')}
      </tr>
    </thead>`;
  const noteBody=`
    <tbody class="note-body">
      ${t.noteRows.map(r=>`
        <tr>
          <td class="code-cell">${esc(r.code)}</td>
          ${Array.from({length:n},(_,j)=>`<td>${esc((r.vals||[])[j]||'')}</td>`).join('')}
        </tr>`).join('')}
    </tbody>`;

  // Materials
  const matRows=t.materials.map(m=>{
    const qtyIsNote = m.qty.toLowerCase().includes('see');
    return `
    <tr>
      <td class="m-item">${esc(m.item)}</td>
      <td class="${qtyIsNote?'m-qty-note':'m-qty'}">${esc(m.qty)}</td>
      <td class="${m.codeBlue?'m-code-blue':'m-code'}">${esc(m.code)}</td>
      <td>${esc(m.desc)}${m.descNote?' <span style="color:#0000cc">(See Notes)</span>':''}${(m.seeItem&&Number(m.seeItem)>0)?' (For length see item <span style="color:#cc0000">'+Number(m.seeItem)+'</span>)':''}</td>
    </tr>`;
  }).join('');

  // Img panel
  let imgHtml='';
  const imgClass=hasImg1&&hasImg2?'two':hasImg1||hasImg2?'one':'';
  if(!hasImg1&&!hasImg2){
    imgHtml=`<div class="spec-img-empty">Upload diagram images in Edit tab</div>`;
  } else if(hasImg1&&hasImg2){
    imgHtml=`<img src="${t.img1}" alt="Diagram 1"/><div class="spec-img-divider"></div><img src="${t.img2}" alt="Diagram 2"/>`;
  } else {
    imgHtml=`<img src="${t.img1||t.img2}" alt="Diagram"/>`;
  }

  // Logo / company in footer
  const footerRight = (!t.noLogo && logo)
    ? `<img src="${logo}" alt="logo" class="spec-logo-img"/><div class="spec-website">${esc(t.website||'')}</div>`
    : `<div class="spec-logo-script">${esc(t.company||'')}</div><div class="spec-website">${esc(t.website||'')}</div>`;

  const subtitleLines=(t.subtitle||'').split('\n').map(l=>esc(l)).join('<br/>');

  document.getElementById('mainContent').innerHTML=`
  <div class="spec-wrap">
    <div class="spec banner-${t.banner||'blue'}" id="theSpec">

      <!-- TOP: image | dims+notes -->
      <div class="spec-top">
        <div class="spec-img-panel ${imgClass}">${imgHtml}</div>

        <div class="spec-right">
          <!-- DIMENSIONS -->
          <div class="spec-dims-block">
            <div class="spec-block-title spec-dims-title">DIMENSIONS</div>
            <table class="spec-rt">${colGroup}${dimHead}${dimBody}</table>
          </div>
          <!-- NOTES -->
          <div class="spec-notes-block">
            <div class="spec-block-title spec-notes-title">NOTES</div>
            <table class="spec-rt">${colGroup}${noteHead}${noteBody}</table>
            ${t.extraNote?`<div class="spec-extra-note">${esc(t.extraNote)}</div>`:''}
          </div>
        </div>
      </div>

      <!-- MATERIALS -->
      <div class="spec-mats">
        <div class="spec-mats-title">MATERIALS</div>
        <table class="spec-mt">
          <colgroup>
            <col class="mc-item"/><col class="mc-qty"/><col class="mc-code"/><col class="mc-desc"/>
          </colgroup>
          <thead><tr>
            <th class="th-item">ITEM</th><th>QTY</th><th>CODE</th><th>DESCRIPTION</th>
          </tr></thead>
          <tbody>${matRows}</tbody>
        </table>
      </div>

      <!-- FOOTER -->
      <div class="spec-footer">
        <div class="spec-footer-left">
          <div class="spec-series-script">${esc(t.series||t.name||'')}</div>
          <div class="spec-subtitle">${subtitleLines}</div>
        </div>
        <div class="spec-footer-mid">
          <div class="spec-page-lbl">PAGE</div>
          <div class="spec-page-val">${esc(t.cat||'—')}</div>
        </div>
        <div class="spec-footer-right">
          ${footerRight}
          <div class="spec-year">${new Date().getFullYear()}</div>
        </div>
      </div>

    </div>
  </div>`;
}

// ── PRINT ──
function doPrint(){
  if(!cid){alert('Select a fence style first.');return;}
  if(ctab!=='preview'){goTab('preview');setTimeout(()=>window.print(),350);return;}
  window.print();
}

renderSB();
</script>
</body>
</html>
