<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FenceSpec Pro — Spec Sheet Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0f2640;--navy2:#1a3a5c;--navy3:#254d78;
  --gold:#c8943a;--gold2:#e0a84a;
  --cream:#f8f4ee;--cream2:#f0ebe0;
  --bg:#e8e5df;--surface:#f7f5f1;
  --border:#d0ccc4;--border2:#b8b4ac;
  --text:#1a1714;--text2:#4a4540;--text3:#7a7570;
  --danger:#b53528;--danger-bg:#fdf0ee;
  --rad:5px;--rad2:9px;
  --sh:0 2px 8px rgba(15,38,64,.10);
  --sh2:0 4px 20px rgba(15,38,64,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* APP SHELL */
.app-bar{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:3px solid var(--gold)}
.app-logo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;color:#fff;letter-spacing:.04em}
.app-logo em{color:var(--gold2);font-style:normal}
.app-divider{width:1px;height:22px;background:rgba(255,255,255,.18)}
.app-sub{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.07em;text-transform:uppercase}
.spacer{flex:1}
.app-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:6px 14px;border-radius:var(--rad);font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.app-btn:hover{background:rgba(255,255,255,.2)}
.app-btn.gold{background:var(--gold);border-color:var(--gold2);font-weight:600}
.app-btn.gold:hover{background:var(--gold2)}

.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:255px;min-width:255px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.sb-search{position:relative}
.sb-search input{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--rad);padding:7px 10px 7px 30px;font-size:12px;font-family:'Barlow',sans-serif;color:var(--text)}
.sb-search input:focus{outline:none;border-color:var(--navy2)}
.sb-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.35;pointer-events:none}
.style-list{flex:1;overflow-y:auto;padding:6px}
.style-item{padding:9px 11px;border-radius:var(--rad);cursor:pointer;border:1px solid transparent;margin-bottom:2px;display:flex;align-items:center;gap:9px;transition:all .14s}
.style-item:hover{background:var(--cream);border-color:var(--border)}
.style-item.active{background:var(--navy);border-color:var(--navy2);color:#fff}
.si-icon{width:32px;height:32px;border-radius:var(--rad);background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.style-item.active .si-icon{background:rgba(255,255,255,.1)}
.si-info{flex:1;min-width:0}
.si-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-cat{font-size:11px;color:var(--text3);margin-top:1px}
.style-item.active .si-cat{color:rgba(255,255,255,.55)}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border)}
.btn-new{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--rad);padding:9px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s}
.btn-new:hover{background:var(--navy2)}
.sb-empty{padding:28px 14px;text-align:center;color:var(--text3);font-size:12px;line-height:1.7}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.toolbar-name{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.03em;flex:1}
.tab-group{display:flex;gap:2px}
.tab{padding:6px 13px;border:1px solid var(--border);border-radius:var(--rad);background:transparent;font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;color:var(--text2);transition:all .14s}
.tab:hover{background:var(--cream)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{padding:6px 13px;border-radius:var(--rad);border:1px solid var(--border);background:#fff;font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:5px;transition:all .14s;white-space:nowrap}
.btn:hover{background:var(--cream);border-color:var(--border2)}
.btn-print{background:var(--gold);border-color:var(--gold2);color:#fff;font-weight:600}
.btn-print:hover{background:var(--gold2)}
.btn-del{color:var(--danger)}
.btn-del:hover{background:var(--danger-bg);border-color:#dca09a}

.content{flex:1;overflow-y:auto;padding:18px}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)}
.empty-icon{font-size:52px;opacity:.25}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text2);letter-spacing:.02em}
.empty p{font-size:13px;text-align:center;max-width:280px;line-height:1.6}
.empty-cta{background:var(--navy);color:#fff;border:none;border-radius:var(--rad);padding:9px 22px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.empty-cta:hover{background:var(--navy2)}

/* FORM */
.fsec{background:#fff;border:1px solid var(--border);border-radius:var(--rad2);padding:15px 17px;margin-bottom:12px}
.fsec-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--cream2);display:flex;align-items:center;gap:7px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px 15px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 15px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px 15px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.f input,.f select,.f textarea{border:1px solid var(--border);border-radius:var(--rad);padding:7px 9px;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);background:var(--surface);width:100%;transition:border-color .14s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy2);background:#fff}
.f textarea{resize:vertical;min-height:65px}

/* IMAGE UPLOAD */
.img-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.img-slot{border:2px dashed var(--border2);border-radius:var(--rad);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:var(--cream);position:relative;overflow:hidden}
.img-slot:hover{border-color:var(--navy2);background:var(--cream2)}
.img-slot img{width:100%;height:100%;object-fit:contain;border-radius:var(--rad)}
.img-slot-label{font-size:12px;color:var(--text3);margin-top:6px;text-align:center;line-height:1.5}
.img-slot .img-clear{position:absolute;top:5px;right:5px;background:var(--danger);color:#fff;border:none;border-radius:3px;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.img-note{font-size:11px;color:var(--text3);grid-column:1/-1;line-height:1.5}

/* DATA TABLE */
.dt-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:var(--navy);color:#fff;padding:6px 9px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dt td{padding:3px 5px;border-bottom:1px solid var(--cream2);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--cream)}
.dt input{border:1px solid transparent;border-radius:3px;padding:5px 6px;font-family:'Barlow',sans-serif;font-size:12px;width:100%;background:transparent;color:var(--text);transition:all .14s}
.dt input:hover{background:#fff;border-color:var(--border)}
.dt input:focus{outline:none;background:#fff;border-color:var(--navy2)}
.icon-del{background:none;border:none;cursor:pointer;padding:4px;border-radius:3px;color:var(--text3);display:flex;align-items:center;transition:all .14s;font-size:13px}
.icon-del:hover{background:var(--danger-bg);color:var(--danger)}
.add-row{margin-top:9px;width:100%;background:var(--cream);border:1px dashed var(--border2);border-radius:var(--rad);padding:6px 12px;font-size:12px;font-family:'Barlow',sans-serif;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .14s}
.add-row:hover{background:var(--cream2);border-color:var(--navy2);color:var(--navy)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.5);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--rad2);padding:22px;width:370px;box-shadow:var(--sh2);border:1px solid var(--border)}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:.03em;margin-bottom:14px}
.modal-fields{display:flex;flex-direction:column;gap:11px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-cancel{padding:7px 16px;border:1px solid var(--border);border-radius:var(--rad);background:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text2)}
.btn-cancel:hover{background:var(--cream)}
.btn-ok{padding:7px 20px;border:none;border-radius:var(--rad);background:var(--navy);color:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600}
.btn-ok:hover{background:var(--navy2)}

/* ═══════════════════════════════════════
   SPEC SHEET — matches the uploaded reference
═══════════════════════════════════════ */
.spec-wrap{background:var(--bg);border-radius:var(--rad2);padding:18px;overflow-x:auto}
.spec{
  background:#fff;
  width:1040px;
  margin:0 auto;
  border:1px solid #aaa;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  color:#111;
  display:flex;
  flex-direction:column;
}

/* TOP SECTION: image(s) left + tables right */
.spec-top{
  display:grid;
  grid-template-columns:1fr 380px;
  border-bottom:1px solid #999;
  min-height:310px;
}
.spec-diagrams{
  border-right:1px solid #999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  gap:8px;
  background:#fff;
}
.spec-diagrams img{
  max-width:100%;
  object-fit:contain;
  display:block;
}
.spec-diagrams.one-img img{ max-height:280px; }
.spec-diagrams.two-imgs img{ max-height:135px; }
.spec-diagrams-empty{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  color:#bbb;font-size:13px;font-style:italic;
  border:2px dashed #ddd;border-radius:4px;
  margin:8px;
}

.spec-right{
  display:flex;
  flex-direction:column;
}

/* DIMENSIONS table */
.spec-dims{padding:8px 10px;border-bottom:1px solid #999;flex-shrink:0}
.spec-section-title{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  text-decoration:underline;
  margin-bottom:5px;
  letter-spacing:.04em;
}
.spec-tbl{width:100%;border-collapse:collapse;font-size:10px}
.spec-tbl th,.spec-tbl td{border:1px solid #888;padding:3px 5px;text-align:center}
.spec-tbl th{background:#d0d8e4;font-weight:bold;font-size:9px}
.spec-tbl td.item-col{font-weight:bold;color:#c00}
.spec-tbl tr:nth-child(even) td{background:#f0f4f8}
.spec-tbl td.hi{background:#ffff99;font-weight:bold;color:#c00}

/* NOTES table */
.spec-notes-box{padding:8px 10px;flex:1}
.spec-notes-tbl{width:100%;border-collapse:collapse;font-size:10px}
.spec-notes-tbl th,.spec-notes-tbl td{border:1px solid #888;padding:3px 5px;text-align:left}
.spec-notes-tbl th{background:#d0d8e4;font-weight:bold;font-size:9px}
.spec-notes-tbl td.code-col{font-weight:bold;color:#00c;white-space:nowrap}
.extra-note{font-size:10px;color:#c00;font-style:italic;margin-top:6px;text-align:right}

/* MATERIALS */
.spec-mats{padding:8px 10px 6px;border-top:1px solid #999}
.spec-mats-tbl{width:100%;border-collapse:collapse;font-size:10px}
.spec-mats-tbl th{background:#222;color:#fff;padding:4px 6px;text-align:left;font-size:9px;font-weight:bold;letter-spacing:.05em;border:1px solid #555}
.spec-mats-tbl td{padding:3px 6px;border:1px solid #ccc;vertical-align:top}
.spec-mats-tbl tr:nth-child(even) td{background:#f8f8f8}
.spec-mats-tbl td.mat-item{font-weight:bold;color:#c00;text-align:center}
.spec-mats-tbl td.mat-code{color:#00c;font-size:9px}
.spec-mats-tbl td.mat-note{color:#c00;font-size:9px}

/* FOOTER BANNER */
.spec-footer{
  background:#f5f5f5;
  border-top:2px solid #999;
  display:flex;
  align-items:stretch;
  min-height:72px;
}
.spec-footer-left{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8px 18px;
  border-right:1px solid #999;
}
.spec-series-name{
  font-family:'Barlow Condensed',Arial,sans-serif;
  font-size:22px;
  font-weight:700;
  font-style:italic;
  color:#111;
  letter-spacing:.03em;
}
.spec-subtitle{font-size:11px;color:#333;margin-top:3px;font-style:italic}
.spec-footer-mid{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:8px 16px;
  border-right:1px solid #999;
  gap:4px;
}
.spec-page-label{font-size:9px;font-weight:bold;color:#555;letter-spacing:.06em;text-transform:uppercase}
.spec-page-val{font-size:13px;font-weight:bold;color:#111}
.spec-footer-right{
  width:180px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  gap:2px;
}
.spec-logo-area{max-width:140px;max-height:52px;object-fit:contain}
.spec-logo-placeholder{font-family:'Barlow Condensed',Arial,sans-serif;font-size:20px;font-weight:700;font-style:italic;color:#333;text-align:center}
.spec-website{font-size:9px;color:#555;text-align:center}
.spec-year{font-size:9px;color:#999;position:absolute;bottom:5px;right:8px}

/* PRINT */
@media print{
  body{overflow:visible!important;height:auto!important;background:#fff!important}
  .app-bar,.sidebar,.toolbar{display:none!important}
  .app-body{display:block}
  .main{display:block;overflow:visible}
  .content{padding:0;overflow:visible}
  .spec-wrap{padding:0;background:none}
  .spec{width:100%!important;box-shadow:none!important;border:1px solid #999!important}
  @page{size:landscape;margin:12mm}
}
</style>
</head>
<body>

<div class="app-bar">
  <div class="app-logo">🏗 Fence<em>Spec</em> Pro</div>
  <div class="app-divider"></div>
  <div class="app-sub">Spec Sheet Generator</div>
  <div class="spacer"></div>
  <button class="app-btn gold" id="globalPrint" onclick="doPrint()" style="display:none">🖨 Print / Save PDF</button>
</div>

<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-label">🏗 Fence Styles</div>
      <div class="sb-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search styles..." id="sbSearch" oninput="filterList()"/>
      </div>
    </div>
    <div class="style-list" id="styleList"></div>
    <div class="sb-foot">
      <button class="btn-new" onclick="openModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New Fence Style
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-name" id="toolbarName"></div>
      <div class="tab-group">
        <button class="tab on" id="tEdit" onclick="goTab('edit')">✏️ Edit</button>
        <button class="tab" id="tPreview" onclick="goTab('preview')">👁 Preview</button>
      </div>
      <button class="btn btn-print" onclick="doPrint()">🖨 Print / PDF</button>
      <button class="btn btn-del" onclick="delStyle()">🗑 Delete</button>
    </div>

    <div class="content" id="mainContent">
      <div class="empty">
        <div class="empty-icon">🔩</div>
        <h2>No Style Selected</h2>
        <p>Create a fence style and upload your diagrams to generate a printable spec sheet.</p>
        <button class="empty-cta" onclick="openModal()">+ Create First Style</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">New Fence Style</div>
    <div class="modal-fields">
      <div class="f"><label>Style Name</label><input id="mName" type="text" placeholder="e.g. Wood Illinois Scalloped" onkeydown="if(event.key==='Enter')doCreate()"/></div>
      <div class="f"><label>Series</label><input id="mSeries" type="text" placeholder="e.g. Wood Illinois Scalloped Series" onkeydown="if(event.key==='Enter')doCreate()"/></div>
      <div class="f"><label>Category / Code</label><input id="mCat" type="text" placeholder="e.g. WIL3" onkeydown="if(event.key==='Enter')doCreate()"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-ok" onclick="doCreate()">Create</button>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="imgInput1" accept="image/*" style="display:none" onchange="loadImg(1,event)"/>
<input type="file" id="imgInput2" accept="image/*" style="display:none" onchange="loadImg(2,event)"/>
<input type="file" id="logoInput" accept="image/*" style="display:none" onchange="loadLogo(event)"/>

<script>
// ── STATE ──
let S = JSON.parse(localStorage.getItem('fsp3_styles')||'[]');
let cid = null, ctab = 'edit';
let logo = localStorage.getItem('fsp3_logo')||null;
let filt = '';

function save(){ localStorage.setItem('fsp3_styles', JSON.stringify(S)); }
function cur(){ return S.find(x=>x.id===cid); }
function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── SIDEBAR ──
function filterList(){ filt = document.getElementById('sbSearch').value.toLowerCase(); renderSB(); }
function renderSB(){
  const el = document.getElementById('styleList');
  const vis = S.filter(s => s.name.toLowerCase().includes(filt)||(s.series||'').toLowerCase().includes(filt));
  if(!vis.length){ el.innerHTML='<div class="sb-empty">No styles yet.<br>Click "New Fence Style" below.</div>'; return; }
  el.innerHTML = vis.map(s=>`
    <div class="style-item ${s.id===cid?'active':''}" onclick="pick('${s.id}')">
      <div class="si-icon">🔩</div>
      <div class="si-info">
        <div class="si-name">${esc(s.name)}</div>
        <div class="si-cat">${esc(s.cat||s.series||'—')}</div>
      </div>
    </div>`).join('');
}

function pick(id){
  cid=id; ctab='edit';
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('globalPrint').style.display='';
  document.getElementById('toolbarName').textContent=cur().name;
  document.getElementById('tEdit').classList.add('on');
  document.getElementById('tPreview').classList.remove('on');
  renderSB(); renderEdit();
}

// ── MODAL ──
function openModal(){ document.getElementById('mName').value=''; document.getElementById('mSeries').value=''; document.getElementById('mCat').value=''; document.getElementById('modal').style.display='flex'; setTimeout(()=>document.getElementById('mName').focus(),40); }
function closeModal(){ document.getElementById('modal').style.display='none'; }
function doCreate(){
  const name=(document.getElementById('mName').value.trim()||'Unnamed Style');
  const series=document.getElementById('mSeries').value.trim();
  const cat=document.getElementById('mCat').value.trim();
  const id='s'+Date.now();
  S.push({id, name, series, cat,
    company:'Your Company', website:'www.yourcompany.com',
    subtitle:'', extraNote:'', pageCode:'',

function delStyle(){
  if(!cid)return;
  if(!confirm(`Delete "${cur().name}"?`))return;
  S=S.filter(x=>x.id!==cid); cid=null; save(); renderSB();
  document.getElementById('toolbar').style.display='none';
  document.getElementById('globalPrint').style.display='none';
  document.getElementById('mainContent').innerHTML=`<div class="empty"><div class="empty-icon">🔩</div><h2>No Style Selected</h2><p>Select or create a fence style.</p><button class="empty-cta" onclick="openModal()">+ Create Style</button></div>`;
}

// ── TABS ──
function goTab(t){
  ctab=t;
  document.getElementById('tEdit').classList.toggle('on',t==='edit');
  document.getElementById('tPreview').classList.toggle('on',t==='preview');
  if(t==='edit') renderEdit(); else renderPreview();
}

// ── IMAGE HANDLING ──
function loadImg(slot, e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const t=cur(); if(!t)return;
    t['img'+slot]=ev.target.result;
    save();
    if(ctab==='edit') renderEdit(); else renderPreview();
  };
  r.readAsDataURL(f);
  e.target.value='';
}
function clearImg(slot){
  const t=cur(); if(!t)return;
  t['img'+slot]=null; save();
  if(ctab==='edit') renderEdit(); else renderPreview();
}
function loadLogo(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{ logo=ev.target.result; localStorage.setItem('fsp3_logo',logo); if(ctab==='edit')renderEdit();else renderPreview(); };
  r.readAsDataURL(f);
  e.target.value='';
}

// ── EDIT VIEW ──
function renderEdit(){
  const t=cur(); if(!t)return;
  const img1Html = t.img1
    ? `<div class="img-slot" style="cursor:default"><img src="${t.img1}" alt="Diagram 1"/><button class="img-clear" onclick="clearImg(1)" title="Remove">✕</button></div>`
    : `<div class="img-slot" onclick="document.getElementById('imgInput1').click()"><span style="font-size:28px;opacity:.3">🖼</span><div class="img-slot-label">Click to upload<br/><b>Diagram Image 1</b></div></div>`;
  const img2Html = t.img2
    ? `<div class="img-slot" style="cursor:default"><img src="${t.img2}" alt="Diagram 2"/><button class="img-clear" onclick="clearImg(2)" title="Remove">✕</button></div>`
    : `<div class="img-slot" onclick="document.getElementById('imgInput2').click()"><span style="font-size:28px;opacity:.3">🖼</span><div class="img-slot-label">Click to upload<br/><b>Diagram Image 2</b> (optional)</div></div>`;

  document.getElementById('mainContent').innerHTML=`
    <div class="fsec">
      <div class="fsec-title">🏢 Company & Style Info</div>
      <div class="fg">
        <div class="f"><label>Company Name</label><input type="text" value="${esc(t.company)}" oninput="u('company',this.value)"/></div>
        <div class="f"><label>Website</label><input type="text" value="${esc(t.website)}" oninput="u('website',this.value)"/></div>
        <div class="f"><label>Style Name</label><input type="text" value="${esc(t.name)}" oninput="u('name',this.value)"/></div>
        <div class="f"><label>Series Name (footer banner)</label><input type="text" value="${esc(t.series)}" oninput="u('series',this.value)"/></div>
        <div class="f"><label>Subtitle (e.g. Pyramid Top...)</label><input type="text" value="${esc(t.subtitle)}" oninput="u('subtitle',this.value)"/></div>
        <div class="f"><label>Page Code (e.g. WIL3)</label><input type="text" value="${esc(t.cat)}" oninput="u('cat',this.value)"/></div>
        <div class="f full"><label>Extra Note (shown in red, top right)</label><input type="text" value="${esc(t.extraNote)}" oninput="u('extraNote',this.value)" placeholder="e.g. Scalloped pickets are with 6&quot; drop"/></div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title">🖼 Diagram Images (shown on spec sheet)</div>
      <div class="img-upload-grid">
        ${img1Html}
        ${img2Html}
        <div class="img-note">• Upload 1 image → fills the full left panel at full size<br>• Upload 2 images → both stack side-by-side, auto-scaled to fit<br>• Use your actual fence drawings/diagrams (PNG, JPG, etc.)</div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title">🏛 Company Logo (footer)</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="img-slot" style="width:200px;min-height:70px" onclick="document.getElementById('logoInput').click()">
          ${logo?`<img src="${logo}" alt="logo" style="max-height:60px"/>`:'<div class="img-slot-label">Click to upload logo</div>'}
        </div>
        ${logo?`<button class="btn" onclick="logo=null;localStorage.removeItem('fsp3_logo');renderEdit()">Remove Logo</button>`:''}
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title">📏 Dimensions Table</div>
      <p style="font-size:11px;color:var(--text3);margin-bottom:10px">Edit column headers and dimension values below.</p>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="width:44px">Item</th>
            ${(t.dimCols||[]).map((_,i)=>`<th><input type="text" value="${esc(t.dimCols[i].label)}" oninput="updDimCol(${i},'label',this.value)" style="color:#fff;background:transparent;font-size:10px"/><br/><input type="text" value="${esc(t.dimCols[i].sub)}" oninput="updDimCol(${i},'sub',this.value)" style="color:rgba(255,255,255,.65);background:transparent;font-size:9px"/></th>`).join('')}
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="dimBody">${renderDimRows(t)}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="add-row" style="flex:1" onclick="addDimRow()">+ Add Row</button>
        <button class="add-row" style="flex:1" onclick="addDimCol()">+ Add Column</button>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title">📝 Notes Table</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="width:64px">Code</th>
            ${(t.noteCols||[]).map((c,i)=>`<th><input type="text" value="${esc(c.label)}" oninput="updNoteCol(${i},this.value)" style="color:#fff;background:transparent;font-size:10px"/></th>`).join('')}
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="noteBody">${renderNoteRows(t)}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="add-row" style="flex:1" onclick="addNoteRow()">+ Add Row</button>
        <button class="add-row" style="flex:1" onclick="addNoteCol()">+ Add Column</button>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title">📋 Materials</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="width:40px">Item</th>
            <th style="width:50px">Qty</th>
            <th style="width:100px">Code</th>
            <th>Description</th>
            <th style="width:70px">Note Flag</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="matBody">${renderMatRows(t)}</tbody>
        </table>
      </div>
      <button class="add-row" onclick="addMatRow()">+ Add Material Row</button>
    </div>
  `;
}

function u(k,v){ const t=cur();if(!t)return;t[k]=v;save();if(k==='name'){document.getElementById('toolbarName').textContent=v;renderSB();} }
function updDimCol(i,k,v){ const t=cur();if(t&&t.dimCols[i]){t.dimCols[i][k]=v;save();} }
function updDimRow(i,j,v){ const t=cur();if(t&&t.dimRows[i]){t.dimRows[i].vals[j]=v;save();} }
function updDimRowItem(i,v){ const t=cur();if(t&&t.dimRows[i]){t.dimRows[i].item=v;save();} }
function updNoteCol(i,v){ const t=cur();if(t&&t.noteCols[i]){t.noteCols[i].label=v;save();} }
function updNoteRowCode(i,v){ const t=cur();if(t&&t.noteRows[i]){t.noteRows[i].code=v;save();} }
function updNoteRowVal(i,j,v){ const t=cur();if(t&&t.noteRows[i]){t.noteRows[i].vals[j]=v;save();} }
function updMat(i,k,v){ const t=cur();if(t&&t.materials[i]){t.materials[i][k]=v;save();} }

function renderDimRows(t){
  return (t.dimRows||[]).map((r,i)=>`
    <tr>
      <td><input type="text" value="${esc(r.item)}" oninput="updDimRowItem(${i},this.value)" style="width:36px"/></td>
      ${(t.dimCols||[]).map((_,j)=>`<td><input type="text" value="${esc((r.vals||[])[j]||'')}" oninput="updDimRow(${i},${j},this.value)"/></td>`).join('')}
      <td><button class="icon-del" onclick="remDimRow(${i})">✕</button></td>
    </tr>`).join('');
}
function renderNoteRows(t){
  return (t.noteRows||[]).map((r,i)=>`
    <tr>
      <td><input type="text" value="${esc(r.code)}" oninput="updNoteRowCode(${i},this.value)" style="width:56px"/></td>
      ${(t.noteCols||[]).map((_,j)=>`<td><input type="text" value="${esc((r.vals||[])[j]||'')}" oninput="updNoteRowVal(${i},${j},this.value)"/></td>`).join('')}
      <td><button class="icon-del" onclick="remNoteRow(${i})">✕</button></td>
    </tr>`).join('');
}
function renderMatRows(t){
  return (t.materials||[]).map((m,i)=>`
    <tr>
      <td><input type="text" value="${esc(m.item)}" oninput="updMat(${i},'item',this.value)" style="width:32px"/></td>
      <td><input type="text" value="${esc(m.qty)}" oninput="updMat(${i},'qty',this.value)" style="width:40px"/></td>
      <td><input type="text" value="${esc(m.code)}" oninput="updMat(${i},'code',this.value)" style="width:88px"/></td>
      <td><input type="text" value="${esc(m.desc)}" oninput="updMat(${i},'desc',this.value)"/></td>
      <td style="text-align:center"><input type="checkbox" ${m.noteFlag?'checked':''} onchange="updMat(${i},'noteFlag',this.checked)" title="Mark code as 'See Notes' in blue"/></td>
      <td><button class="icon-del" onclick="remMat(${i})">✕</button></td>
    </tr>`).join('');
}

function addDimRow(){ const t=cur();if(!t)return; t.dimRows.push({item:String(t.dimRows.length+1),vals:t.dimCols.map(()=>'')}); save();renderEdit(); }
function remDimRow(i){ const t=cur();if(t){t.dimRows.splice(i,1);save();renderEdit();} }
function addDimCol(){ const t=cur();if(!t)return; t.dimCols.push({label:'',sub:''}); t.dimRows.forEach(r=>r.vals.push('')); save();renderEdit(); }
function addNoteRow(){ const t=cur();if(!t)return; t.noteRows.push({code:'',vals:t.noteCols.map(()=>'')}); save();renderEdit(); }
function remNoteRow(i){ const t=cur();if(t){t.noteRows.splice(i,1);save();renderEdit();} }
function addNoteCol(){ const t=cur();if(!t)return; t.noteCols.push({label:''}); t.noteRows.forEach(r=>r.vals.push('')); save();renderEdit(); }
function addMatRow(){ const t=cur();if(!t)return; const items='ABCDEFGH'; t.materials.push({item:items[t.materials.length]||'',qty:'',code:'',desc:'',noteFlag:false}); save();renderEdit(); }
function remMat(i){ const t=cur();if(t){t.materials.splice(i,1);save();renderEdit();} }

// ── PREVIEW ──
function renderPreview(){
  const t=cur(); if(!t)return;
  const hasImg1=!!t.img1, hasImg2=!!t.img2;
  const imgClass = (hasImg1&&hasImg2)?'two-imgs':(hasImg1||hasImg2)?'one-img':'';

  let diagHtml='';
  if(!hasImg1&&!hasImg2){
    diagHtml=`<div class="spec-diagrams-empty">Upload diagram images in Edit tab</div>`;
  } else if(hasImg1&&hasImg2){
    diagHtml=`
      <img src="${t.img1}" alt="Diagram 1" style="max-width:100%;max-height:140px;object-fit:contain"/>
      <div style="width:100%;border-top:1px dashed #ccc"></div>
      <img src="${t.img2}" alt="Diagram 2" style="max-width:100%;max-height:140px;object-fit:contain"/>`;
  } else {
    diagHtml=`<img src="${t.img1||t.img2}" alt="Diagram" style="max-width:100%;max-height:290px;object-fit:contain"/>`;
  }

  // Dimensions table
  const dimHead = `<tr><th class="spec-tbl" style="background:#d0d8e4">ITEM</th>${(t.dimCols||[]).map(c=>`<th>${esc(c.label)}<br/><span style="font-size:8px;font-weight:normal">${esc(c.sub)}</span></th>`).join('')}</tr>`;
  const dimBody = (t.dimRows||[]).map((r,ri)=>`
    <tr>
      <td class="item-col ${ri===0?'hi':''}">${esc(r.item)}</td>
      ${(t.dimCols||[]).map((_,j)=>`<td class="${ri===0&&j<2?'hi':''}">${esc((r.vals||[])[j]||'')}</td>`).join('')}
    </tr>`).join('');

  // Notes table
  const noteHead = `<tr><th>Code</th>${(t.noteCols||[]).map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr>`;
  const noteBody = (t.noteRows||[]).map(r=>`
    <tr>
      <td class="code-col">${esc(r.code)}</td>
      ${(t.noteCols||[]).map((_,j)=>`<td>${esc((r.vals||[])[j]||'')}</td>`).join('')}
    </tr>`).join('');

  // Materials
  const matRows = (t.materials||[]).map(m=>`
    <tr>
      <td class="mat-item">${esc(m.item)}</td>
      <td style="text-align:center">${esc(m.qty)}</td>
      <td class="${m.noteFlag?'mat-note':''}">${esc(m.code)}</td>
      <td>${esc(m.desc)}${m.noteFlag?` <span class="mat-note">(See Notes)</span>`:''}</td>
    </tr>`).join('');

  const footerLogo = logo
    ? `<img src="${logo}" alt="logo" class="spec-logo-area"/>`
    : `<div class="spec-logo-placeholder">${esc(t.company||'Logo')}</div>`;

  document.getElementById('mainContent').innerHTML=`
    <div class="spec-wrap">
      <div class="spec" id="theSpec">

        <div class="spec-top">
          <div class="spec-diagrams ${imgClass}">${diagHtml}</div>
          <div class="spec-right">
            <div class="spec-dims">
              <div class="spec-section-title">DIMENSIONS</div>
              <table class="spec-tbl"><thead>${dimHead}</thead><tbody>${dimBody}</tbody></table>
            </div>
            <div class="spec-notes-box">
              <div class="spec-section-title">Notes</div>
              <table class="spec-notes-tbl"><thead>${noteHead}</thead><tbody>${noteBody}</tbody></table>
              ${t.extraNote?`<div class="extra-note">${esc(t.extraNote)}</div>`:''}
            </div>
          </div>
        </div>

        <div class="spec-mats">
          <div class="spec-section-title" style="margin-bottom:6px">MATERIALS</div>
          <table class="spec-mats-tbl">
            <thead><tr>
              <th style="width:40px">ITEM</th>
              <th style="width:40px">QTY</th>
              <th style="width:110px">CODE</th>
              <th>DESCRIPTION</th>
            </tr></thead>
            <tbody>${matRows}</tbody>
          </table>
        </div>

        <div class="spec-footer">
          <div class="spec-footer-left">
            <div class="spec-series-name">${esc(t.series||t.name||'')}</div>
            <div class="spec-subtitle">${esc(t.subtitle||'')}</div>
          </div>
          <div class="spec-footer-mid">
            <div class="spec-page-label">PAGE</div>
            <div class="spec-page-val">${esc(t.cat||'—')}</div>
          </div>
          <div class="spec-footer-right">
            ${footerLogo}
            <div class="spec-website">${esc(t.website||'')}</div>
          </div>
        </div>

      </div>
    </div>`;
}

// ── PRINT ──
function doPrint(){
  if(!cid){alert('Select a fence style first.');return;}
  if(ctab!=='preview'){goTab('preview');setTimeout(()=>window.print(),350);return;}
  window.print();
}

// ── INIT ──
renderSB();
</script>
</body>
</html>
